services:
  - type: web
    name: flowsyncai-api
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: FLOWSYNC_EXPERIMENT_DB
        value: /var/data/experiments.sqlite3
      - key: DATABASE_URL
        sync: false
      - key: FLOWSYNC_LOG_LEVEL
        value: INFO
      - key: FLOWSYNC_CORS_ORIGINS
        sync: false
    disk:
      name: flowsync-data
      mountPath: /var/data
      sizeGB: 1
