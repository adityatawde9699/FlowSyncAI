services:
  - type: web
    name: flowsyncai-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: FLOWSYNC_EXPERIMENT_DB
        value: /tmp/experiments.sqlite3
      - key: DATABASE_URL
        sync: false
      - key: FLOWSYNC_LOG_LEVEL
        value: INFO
      - key: FLOWSYNC_CORS_ORIGINS
        value: https://flowsyncaiseva.vercel.app,http://localhost:5173
      - key: FLOWSYNC_ENGINE
        value: fallback

