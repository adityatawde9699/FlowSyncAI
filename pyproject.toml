[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowsync-ai"
version = "0.1.0"
description = "Incident-aware decentralized traffic control research simulator"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
sumo = ["traci>=1.19", "sumolib>=1.19"]
perception = ["opencv-python-headless>=4.9"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
flowsync = "flowsync.cli:main"

[tool.setuptools.packages.find]
include = ["flowsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
